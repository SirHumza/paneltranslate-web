<!doctype html><meta charset="utf-8"><title>PanelTranslate rendering tests</title>
<pre id="report">Running</pre>
<script type="module">
import {renderPage} from '../render.js';
const canvas=document.createElement('canvas');
canvas.width=320; canvas.height=160;
const ctx=canvas.getContext('2d',{willReadFrequently:true});
ctx.fillStyle='white';ctx.fillRect(0,0,320,160);
ctx.strokeRect(15,15,280,125);
ctx.font='20px Arial';ctx.fillStyle='black';ctx.fillText('SELAMAT PAGI',45,70);
const region={text:'SELAMAT PAGI',translation:'Good morning!',box:[43,52,155,22]};
const original=ctx.getImageData(0,0,320,160).data;
const bytes=c=>c.getContext('2d').getImageData(0,0,320,160).data;
const assert=(v,m)=>{if(!v) throw Error(m)};
try{
 const result=renderPage(canvas,[region]);
 assert(result.rendered.length===1,JSON.stringify(result.issues));
 const [x,y,w,h]=result.rendered[0].box;
 const actual=bytes(result.canvas);
 assert(actual.some((v,i)=>v!==original[i]),'no lettering change');
 assert(actual.every((v,i)=>{const p=i>>2;return ((p%320)>=x&&(p%320)<x+w&&(p/320|0)>=y&&(p/320|0)<y+h)||v===original[i]}),'external damage');
 assert(bytes(canvas).every((v,i)=>original[i]===v),'source mutated');
 const tooLong=renderPage(canvas,[{...region,translation:'a'.repeat(200)}]);
 assert(tooLong.issues[0].code==='overflow' && bytes(tooLong.canvas).every((v,i)=>original[i]===v),'overflow damaged page');
 const protectedRegion=renderPage(canvas,[region,{...region,enabled:false}]);
 assert(protectedRegion.issues[0].code==='overlap' && bytes(protectedRegion.canvas).every((v,i)=>original[i]===v),'disabled region changed');
 ctx.fillStyle='red';ctx.fillRect(43,52,1,1);
 const bytesSource=bytes(canvas);
 const unsafe=renderPage(canvas,[region]);
 assert(unsafe.issues[0].code==='unsafe-background' && bytes(unsafe.canvas).every((v,i)=>bytesSource[i]===v),'unsafe cleanup');
 document.querySelector('#report').textContent='PASS';
}catch(e){document.querySelector('#report').textContent=String(e)}

</script>
